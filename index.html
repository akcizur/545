<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9eaed" />
    <meta name="description" content="545 — a small library of tactile interface materials and button interactions." />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem('545-theme')
          const theme = savedTheme === 'dark' || savedTheme === 'light'
            ? savedTheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          const root = document.documentElement
          root.dataset.theme = theme
          root.style.colorScheme = theme
          const themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) themeColor.content = theme === 'dark' ? '#111214' : '#e9eaed'
        } catch {
          // Keep the default theme when browser storage is unavailable.
        }
      })()
    </script>
    <title>545 — Material Studies</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
